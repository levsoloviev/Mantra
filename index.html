<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ом Вакратундайя Хум</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0d;
    color: #e8dfc8;
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    user-select: none;
    -webkit-user-select: none;
  }

  .container {
    max-width: 520px;
    width: 100%;
    text-align: center;
  }

  .symbol {
    font-size: 3.5rem;
    font-weight: 300;
    color: #c9a84c;
    letter-spacing: 0.05em;
    line-height: 1;
    margin-bottom: 2rem;
    opacity: 0.85;
  }

  h1 {
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    color: #e8dfc8;
    margin-bottom: 0.5rem;
    line-height: 1.3;
  }

  .subtitle {
    font-size: 1rem;
    font-weight: 300;
    font-style: italic;
    color: #8a7d65;
    letter-spacing: 0.08em;
    margin-bottom: 3rem;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: #c9a84c;
    opacity: 0.4;
    margin: 0 auto 3rem;
  }

  /* Custom audio player */
  .player {
    background: #161616;
    border: 1px solid #2a2520;
    border-radius: 4px;
    padding: 2rem 2rem 1.75rem;
    margin-bottom: 2.5rem;
  }

  .progress-wrap {
    position: relative;
    height: 2px;
    background: #2a2520;
    border-radius: 1px;
    margin-bottom: 1.5rem;
    cursor: pointer;
  }

  .progress-bar {
    height: 100%;
    background: #c9a84c;
    border-radius: 1px;
    width: 0%;
    transition: width 0.1s linear;
    pointer-events: none;
  }

  .progress-thumb {
    position: absolute;
    top: 50%;
    left: 0%;
    transform: translate(-50%, -50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #c9a84c;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }

  .progress-wrap:hover .progress-thumb { opacity: 1; }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  .btn-play {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid #c9a84c;
    background: transparent;
    color: #c9a84c;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
    flex-shrink: 0;
  }

  .btn-play:hover {
    background: #c9a84c;
    color: #0d0d0d;
  }

  .btn-play svg {
    width: 18px;
    height: 18px;
    pointer-events: none;
  }

  .time {
    font-size: 0.78rem;
    color: #5a5044;
    letter-spacing: 0.1em;
    font-weight: 400;
    font-family: 'Cormorant Garamond', serif;
    margin-top: 1.25rem;
    text-align: center;
  }

  .note {
    font-size: 0.82rem;
    font-style: italic;
    color: #4a4438;
    letter-spacing: 0.06em;
    line-height: 1.7;
  }

  /* Prevent right-click and drag */
  audio { display: none !important; }
</style>
</head>
<body oncontextmenu="return false">

<div class="container">
  <div class="symbol">ॐ</div>
  <h1>Ом Вакратундайя Хум</h1>
  <p class="subtitle">мантра Ганеши</p>
  <div class="divider"></div>

  <div class="player">
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
      <div class="progress-thumb" id="progressThumb"></div>
    </div>

    <div class="controls">
      <button class="btn-play" id="playBtn" aria-label="Воспроизвести">
        <svg id="iconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>

    <div class="time" id="timeDisplay">0:00 / 0:00</div>
  </div>

  <p class="note">Запись защищена от скачивания.</p>
</div>

<audio id="audioEl" preload="metadata"></audio>

<script>
(function() {
  // Replace this path with the actual server path to your audio file
  const AUDIO_SRC = 'Om_Vakratundaya_Hum.m4a';

  const audio = document.getElementById('audioEl');
  const playBtn = document.getElementById('playBtn');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const progressBar = document.getElementById('progressBar');
  const progressThumb = document.getElementById('progressThumb');
  const progressWrap = document.getElementById('progressWrap');
  const timeDisplay = document.getElementById('timeDisplay');

  audio.src = AUDIO_SRC;

  function fmt(s) {
    if (isNaN(s)) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function updateTime() {
    const cur = audio.currentTime || 0;
    const dur = audio.duration || 0;
    const pct = dur ? (cur / dur) * 100 : 0;
    progressBar.style.width = pct + '%';
    progressThumb.style.left = pct + '%';
    timeDisplay.textContent = fmt(cur) + ' / ' + fmt(dur);
  }

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
    } else {
      audio.pause();
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
    }
  });

  audio.addEventListener('timeupdate', updateTime);
  audio.addEventListener('loadedmetadata', updateTime);
  audio.addEventListener('ended', () => {
    iconPlay.style.display = 'block';
    iconPause.style.display = 'none';
    audio.currentTime = 0;
    updateTime();
  });

  progressWrap.addEventListener('click', e => {
    if (!audio.duration) return;
    const rect = progressWrap.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    audio.currentTime = pct * audio.duration;
  });

  // Block keyboard shortcuts that could trigger save
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
    }
  });

  // Disable drag on the page
  document.addEventListener('dragstart', e => e.preventDefault());
})();
</script>
</body>
</html>
